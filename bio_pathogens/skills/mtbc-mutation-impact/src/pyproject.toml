[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtbc-mutation-impact"
version = "0.1.0"
description = "ESM Atlas per-residue SAE WT vs MT comparison for MTBC mutations"
requires-python = ">=3.10"
dependencies = [
    "esm-atlas-cli",
    "mtbc-gene-function",
]

[project.scripts]
mtbc-mutation-impact = "mtbc_mutation_impact.__main__:main"

[tool.setuptools.packages.find]
include = ["mtbc_mutation_impact*"]
