[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtbc-pathway-explain"
version = "0.1.0"
description = "Curated, network-aware narration of MTBC pathways and gene sets"
requires-python = ">=3.10"
# pyyaml is the only pip dependency. The sibling skills are wired on PYTHONPATH by
# run_pathway.sh: mtbc-gene-function (required, curated per-gene annotation),
# mtbc-gene-network (optional, PPI context), esm-atlas-cli (optional, --esm).
dependencies = ["pyyaml>=6.0"]

[project.scripts]
mtbc-pathway-explain = "mtbc_pathway_explain.__main__:main"

[tool.setuptools.packages.find]
include = ["mtbc_pathway_explain*"]

[tool.setuptools.package-data]
mtbc_pathway_explain = ["data/*.yaml"]
