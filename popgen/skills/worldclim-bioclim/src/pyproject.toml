[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wcbio-client"
version = "0.1.0"
description = "Point-sampler for WorldClim/CHELSA bioclim rasters (rasterio)"
requires-python = ">=3.10"
# Raster I/O genuinely needs rasterio. Install in a dedicated venv (Python 3.11):
#   /home/christophe/venvs/geo311  (pip install rasterio)
dependencies = ["rasterio>=1.3"]

[project.scripts]
wcbio = "wcbio_client.__main__:main"

[tool.setuptools.packages.find]
include = ["wcbio_client*"]
