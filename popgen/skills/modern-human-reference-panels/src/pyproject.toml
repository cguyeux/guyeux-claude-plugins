[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mhrp-client"
version = "0.1.0"
description = "Resilient stdlib-only client for modern human reference panels (HGDP+1kGP metadata)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mhrp = "mhrp_client.__main__:main"

[tool.setuptools.packages.find]
include = ["mhrp_client*"]
