[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amtdb-client"
version = "0.1.0"
description = "Resilient stdlib-only client for AmtDB (ancient human mtDNA samples)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
amtdb = "amtdb_client.__main__:main"

[tool.setuptools.packages.find]
include = ["amtdb_client*"]
