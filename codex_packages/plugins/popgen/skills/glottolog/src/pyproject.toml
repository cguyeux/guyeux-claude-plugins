[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glottolog-client"
version = "0.1.0"
description = "Resilient stdlib-only client for the Glottolog languoid catalogue"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
glottolog = "glottolog_client.__main__:main"

[tool.setuptools.packages.find]
include = ["glottolog_client*"]
