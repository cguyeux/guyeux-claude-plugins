[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owtrad-client"
version = "0.1.0"
description = "Resilient client for OWTRAD (Old World Trade Routes) vector route files"
requires-python = ">=3.10"
# Vector I/O needs geopandas (present on the system Python); not pinned here so the
# skill uses whatever interpreter already has geopandas/fiona/shapely.
dependencies = []

[project.scripts]
owtrad = "owtrad_client.__main__:main"

[tool.setuptools.packages.find]
include = ["owtrad_client*"]
