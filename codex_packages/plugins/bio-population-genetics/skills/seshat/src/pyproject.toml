[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seshat-client"
version = "0.1.0"
description = "Resilient stdlib-only client for the Seshat Global History Databank (polity records)"
requires-python = ">=3.10"
# stdlib-only (urllib/csv/zipfile/xml): nothing to install. Reads .csv and .xlsx.
dependencies = []

[project.scripts]
seshat = "seshat_client.__main__:main"

[tool.setuptools.packages.find]
include = ["seshat_client*"]
