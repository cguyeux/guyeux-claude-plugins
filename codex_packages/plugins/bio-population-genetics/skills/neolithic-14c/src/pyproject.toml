[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neolithic14c-client"
version = "0.1.0"
description = "Resilient stdlib-only client for NERD (Neolithic radiocarbon dates)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
neolithic-14c = "neolithic14c_client.__main__:main"

[tool.setuptools.packages.find]
include = ["neolithic14c_client*"]
