[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dplace-client"
version = "0.1.0"
description = "Resilient stdlib-only client for D-PLACE (ethnographic societies)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
d-place = "dplace_client.__main__:main"

[tool.setuptools.packages.find]
include = ["dplace_client*"]
